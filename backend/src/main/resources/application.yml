spring:
  application:
    name: neuralbase-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/neuralbase
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
neuralbase:
  auth:
    jwt-secret: ${JWT_SECRET:neuralbase-dev-secret-key-please-change-me-32bytes!}
    token-expire-hours: 24
    default-admin-password: ${ADMIN_PASSWORD:admin123}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
  ai:
    siliconflow-base-url: https://api.siliconflow.cn/v1
    siliconflow-api-key: ${SILICONFLOW_API_KEY:}
server:
  port: 8080
